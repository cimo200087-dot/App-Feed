<html lang="it">

<style>
/* Layout: lista di schede orizzontali (foto a sinistra, quote a destra), scheda di dettaglio a pannello dal basso, confronto in tabella */
:root {
  color-scheme: light;
  --bg: #edeff2; --surface: #ffffff; --ink: #14181f; --muted: #5f6775; --line: #d8dce2;
  --accent: #2a5bd7; --accent-ink: #ffffff; --chip: #e3e6eb;
  --ok: #17754c; --ok-bg: #dcf1e5; --warn: #8a5a0b; --warn-bg: #f7e8c8;
  --bad: #b02a1c; --bad-bg: #f9dcd7; --info: #2147b0; --info-bg: #dde6fb;
  --font-display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0e1116; --surface: #171b22; --ink: #eceef2; --muted: #98a0ae; --line: #262c36;
    --accent: #6c93ff; --accent-ink: #08122b; --chip: #222834;
    --ok: #5fd09b; --ok-bg: #14301f; --warn: #e8bb6a; --warn-bg: #35290f;
    --bad: #ff8d7e; --bad-bg: #3a1a16; --info: #8fb0ff; --info-bg: #18274a;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
  padding-block: env(safe-area-inset-top, 0px) calc(110px + env(safe-area-inset-bottom, 0px));
}
body.lock { overflow: hidden; }
.wrap { max-width: 1180px; margin-inline: auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: 0; z-index: 10; background: var(--bg); padding-block: 12px 10px; display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; margin: 0; }
.seg { display: flex; background: var(--chip); border-radius: 11px; padding: 3px; }
.seg button { border: 0; background: none; padding: 7px 15px; border-radius: 8px; color: var(--muted); font-weight: 500; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.add { display: flex; gap: 8px; }
.add input { flex: 1; min-width: 0; font-size: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.add input::placeholder { color: var(--muted); }
.add button { border: 0; border-radius: 10px; padding: 0 18px; background: var(--accent); color: var(--accent-ink); font-weight: 500; }

.demo { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); background: var(--chip); border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; }
.demo button { background: none; border: 0; text-decoration: underline; white-space: nowrap; padding: 6px 0; }

.sum { display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
.stat { background: var(--surface); padding: 9px 12px; min-width: 0; }
.stat .k { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-family: var(--font-display); font-weight: 600; font-size: 19px; line-height: 1.25; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }

.stat .v .u { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); }
.bar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.fchip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; color: var(--muted); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.fchip b { font-family: var(--font-mono); font-weight: 500; margin-left: 4px; }
.sort { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.sort select { font-size: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }

.list { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 760px) { .list { grid-template-columns: 1fr 1fr; gap: 12px; } body { padding-inline: 20px; } }
@media (min-width: 1080px) { .list { grid-template-columns: repeat(3, 1fr); } }

.card { position: relative; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; }
.card.off { opacity: .62; }
.card.off .c-title { text-decoration: line-through; }
.thumb { width: 92px; aspect-ratio: 1; border-radius: 10px; background: var(--chip); overflow: hidden; display: grid; place-items: center; color: var(--muted); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb svg { width: 40px; height: 40px; }
.c-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.c-title { font-family: var(--font-display); font-weight: 600; font-size: 16px; line-height: 1.2; letter-spacing: -0.005em; margin: 0; padding-right: 34px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.c-zone { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-price { font-family: var(--font-mono); font-size: 18px; font-weight: 500; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.c-price small { font-size: 12px; color: var(--muted); font-weight: 400; }
.c-price .none { font-size: 13px; color: var(--muted); font-family: var(--font-body); }
.c-meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
.pill { font-size: 11.5px; line-height: 1.5; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--ink); font-weight: 500; white-space: nowrap; }
.pill[data-t="ok"] { background: var(--ok-bg); color: var(--ok); }
.pill[data-t="warn"] { background: var(--warn-bg); color: var(--warn); }
.pill[data-t="bad"] { background: var(--bad-bg); color: var(--bad); }
.pill[data-t="info"] { background: var(--info-bg); color: var(--info); }
.pill[data-t="mute"] { color: var(--muted); }
.pick { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; color: transparent; font-size: 17px; line-height: 1; }
.pick[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; }

.foot { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.foot .budget { display: flex; align-items: center; gap: 8px; flex-basis: 100%; }
.foot .budget input { width: 110px; font-size: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
#cityIn { width: 170px !important; }
.geo small { display: block; margin-top: 3px; opacity: .85; overflow-wrap: anywhere; }
.foot button, .foot label.btn { font-size: 13px; background: var(--chip); border: 0; border-radius: 8px; padding: 9px 12px; color: var(--ink); cursor: pointer; }
.hidden-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
#msg { flex-basis: 100%; min-height: 1.4em; }

.cmpbar { position: fixed; z-index: 20; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin-inline: auto; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 8px 8px 8px 16px; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.28); }
.cmpbar span { flex: 1; font-weight: 500; }
.cmpbar button { border: 0; border-radius: 9px; padding: 10px 14px; font-weight: 500; }
.cmpbar .go { background: var(--accent); color: var(--accent-ink); }
.cmpbar .no { background: transparent; color: var(--bg); opacity: .8; }

.overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; }
.backdrop { position: absolute; inset: 0; background: rgba(8,10,14,.52); }
.sheet { position: relative; width: 100%; max-width: 680px; margin-inline: auto; max-height: 92vh; max-height: 92dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--surface); border-radius: 18px 18px 0 0; padding: 0 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
.sheet.wide { max-width: 980px; height: 92vh; height: 92dvh; }
.sheet-head { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 10px; }
.sheet-head h2 { font-family: var(--font-display); font-size: 20px; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
.sheet-head button { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 9px; padding: 8px 16px; font-weight: 500; }
.form { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 12px; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; min-width: 0; font-size: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.field textarea { min-height: 74px; resize: vertical; }
.row { display: flex; gap: 8px; align-items: stretch; }
.row input { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 14px; text-decoration: none; font-size: 14px; white-space: nowrap; }
.hint { font-size: 13px; background: var(--info-bg); color: var(--info); border-radius: 10px; padding: 9px 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.hint[data-t="warn"] { background: var(--warn-bg); color: var(--warn); }
.hint button { background: none; border: 0; text-decoration: underline; color: inherit; white-space: nowrap; }
.calc { font-family: var(--font-mono); font-size: 13px; background: var(--bg); border-radius: 10px; padding: 10px 12px; display: grid; gap: 3px; font-variant-numeric: tabular-nums; }
.calc div { display: flex; justify-content: space-between; gap: 12px; }
.calc span:first-child { color: var(--muted); }
.stars { display: flex; gap: 2px; }
.stars button { background: none; border: 0; font-size: 28px; line-height: 1; padding: 4px; color: var(--line); }
.stars button.on { color: var(--warn); }
.photo-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.photo-row img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; }
.danger { border: 1px solid var(--bad); background: none; color: var(--bad); border-radius: 10px; padding: 11px 14px; font-weight: 500; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table.cmp { border-collapse: collapse; width: 100%; }
.cmp th, .cmp td { padding: 9px 11px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; font-size: 13.5px; min-width: 132px; }
.cmp tr:last-child th, .cmp tr:last-child td { border-bottom: 0; }
.cmp th[scope="row"] { position: sticky; left: 0; background: var(--surface); color: var(--muted); font-weight: 500; font-size: 12px; min-width: 92px; z-index: 1; }
.cmp thead th { font-family: var(--font-display); font-size: 15px; font-weight: 600; background: var(--surface); }
.cmp td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.cmp td.best { color: var(--ok); font-weight: 600; background: var(--ok-bg); }
.cmp ul { margin: 0; padding-left: 16px; }
.cmp .x { display: block; margin-top: 4px; background: none; border: 0; padding: 0; font-size: 12px; color: var(--muted); text-decoration: underline; font-family: var(--font-body); font-weight: 400; }
.cmp img { width: 100%; max-width: 120px; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; display: block; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Case</h1>
      <div class="seg" role="tablist" aria-label="Tipo di annuncio">
        <button type="button" role="tab" id="mAff" data-mode="affitto">Affitto</button>
        <button type="button" role="tab" id="mVen" data-mode="vendita">Vendita</button>
      </div>
    </div>
    <form class="add" id="addForm">
      <input id="url" type="text" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Incolla il link dell'annuncio">
      <button type="submit">Aggiungi</button>
    </form>
  </header>

  <div class="demo" id="demo" hidden>
    <span>Gli annunci con l'etichetta "esempio" servono solo da prova.</span>
    <button type="button" id="clearDemo">Svuota esempi</button>
  </div>

  <section class="sum" id="sum" aria-label="Riepilogo"></section>
  <div class="bar">
    <div class="chips" id="chips"></div>
    <label class="sort">Ordina per
      <select id="sort">
        <option value="recenti">Più recenti</option>
        <option value="ppsm">Prezzo al mq</option>
        <option value="total">Costo totale</option>
        <option value="station">Distanza stazione</option>
        <option value="rating">Voto</option>
      </select>
    </label>
  </div>

  <main class="list" id="list"></main>
  <p class="empty" id="empty" hidden></p>

  <footer class="foot">
    <div class="budget"><label for="budgetIn" id="budgetLbl">Budget massimo</label><input id="budgetIn" type="text" inputmode="decimal" placeholder="nessuno"></div>
    <div class="budget"><label for="cityIn">Città di ricerca</label><input id="cityIn" type="text" placeholder="es. Pavia" autocomplete="off"></div>
    <button type="button" id="exportBtn">Scarica backup</button>
    <label class="btn" for="importFile">Ripristina da file</label>
    <input class="hidden-file" id="importFile" type="file" accept=".json,application/json">
    <span id="msg" role="status"></span>
  </footer>
</div>

<div class="cmpbar" id="cmpbar" hidden>
  <span id="cmpCount"></span>
  <button type="button" class="no" id="cmpClear">Annulla</button>
  <button type="button" class="go" id="cmpGo">Confronta</button>
</div>

<div class="overlay" id="sheetWrap" hidden>
  <div class="backdrop" id="sheetBack"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-label="Dettagli annuncio">
    <div class="sheet-head"><h2>Dettagli</h2><button type="button" id="sheetClose">Fatto</button></div>
    <div class="form" id="sheetBody"></div>
  </section>
</div>

<div class="overlay" id="cmpWrap" hidden>
  <div class="backdrop" id="cmpBack"></div>
  <section class="sheet wide" role="dialog" aria-modal="true" aria-label="Confronto">
    <div class="sheet-head"><h2>Confronto</h2><button type="button" id="cmpClose">Chiudi</button></div>
    <div class="tbl-wrap" id="cmpBody"></div>
  </section>
</div>

<script>
(function () {
"use strict";
var KEY = "casa-tracker-v1";
var STATI = [["da_vedere", "Da vedere"], ["contattata", "Contattata"], ["visitata", "Visitata"], ["trattativa", "In trattativa"], ["scartata", "Scartata"]];
var STATO_T = { da_vedere: "", contattata: "info", visitata: "info", trattativa: "ok", scartata: "mute" };
var JUNK = /just a moment|attention required|access denied|forbidden|captcha|robot|verifying|are you human|pardon our interruption|cloudflare|403|not found|404/i;
var HOUSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>';

var S = { items: [], settings: { budget: { affitto: 600, vendita: null }, city: "Pavia" }, mode: "affitto", filter: "attive", sort: "recenti", selected: new Set() };
var SH = null, inflight = {}, saveT = null;

function $(id) { return document.getElementById(id); }
function h(tag, props, kids) {
  var n = document.createElement(tag), val;
  if (props) Object.keys(props).forEach(function (k) {
    var v = props[k];
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "value") val = v;
    else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  });
  (kids || []).forEach(function (c) { if (c == null || c === false) return; n.appendChild(typeof c === "object" ? c : document.createTextNode(String(c))); });
  if (val !== undefined) n.value = val;
  return n;
}
function say(t) { $("msg").textContent = t || ""; }

/* ---------- dati ---------- */
function demoItems() {
  var t = Date.now(), base = { demo: true, meta: "manual", url: "", photo: "", img: "" };
  function mk(i, o) { return Object.assign({ id: "d" + i, created: t - i * 1000, updated: t - i * 1000, mode: "affitto", status: "da_vedere", rating: 0, pros: "", cons: "", notes: "", contact: "", phone: "", visit: "" }, base, o); }
  return [
    mk(1, { title: "Bilocale arredato vicino alla stazione", zone: "Centro", station: 8, price: 560, condo: 40, sqm: 48, rooms: 2, floor: "2", furnished: "si", contract: "4+4", status: "visitata", rating: 4, pros: "Luminoso\nCucina nuova", cons: "Niente ascensore" }),
    mk(2, { title: "Trilocale in zona ospedale", zone: "Zona ospedale", station: 15, price: 640, condo: 50, sqm: 70, rooms: 3, floor: "3", furnished: "no", contract: "3+2", status: "da_vedere" }),
    mk(3, { title: "Monolocale ristrutturato", zone: "Borgo", station: 5, price: 480, condo: 30, sqm: 28, rooms: 1, floor: "T", furnished: "si", contract: "transitorio", status: "scartata", cons: "Troppo piccolo" }),
    mk(4, { mode: "vendita", title: "Trilocale da ristrutturare", zone: "Zona nord", station: 20, price: 148000, condo: 90, reno: 25000, sqm: 82, rooms: 3, floor: "1", status: "contattata" }),
    mk(5, { mode: "vendita", title: "Bilocale con balcone", zone: "Centro", station: 10, price: 165000, condo: 70, reno: 0, sqm: 55, rooms: 2, floor: "4", status: "da_vedere", rating: 3 })
  ];
}
function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var d = JSON.parse(raw);
      if (d && Array.isArray(d.items)) {
        S.items = d.items;
        if (d.settings && d.settings.budget) S.settings = d.settings;
        if (S.settings.city === undefined) S.settings.city = "Pavia";
        if (d.mode === "affitto" || d.mode === "vendita") S.mode = d.mode;
        if (d.filter) S.filter = d.filter;
        if (d.sort) S.sort = d.sort;
        return;
      }
    }
  } catch (e) {}
  S.items = demoItems(); save();
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ v: 1, items: S.items, settings: S.settings, mode: S.mode, filter: S.filter, sort: S.sort }));
    return true;
  } catch (e) { say("Non riesco a salvare: la memoria del browser è piena. Rimuovi qualche foto o scarica un backup."); return false; }
}
function queueSave() { clearTimeout(saveT); saveT = setTimeout(save, 250); }
function find(id) { return S.items.filter(function (x) { return x.id === id; })[0]; }

/* ---------- numeri ---------- */
var nf0 = new Intl.NumberFormat("it-IT", { maximumFractionDigits: 0 });
var nf1 = new Intl.NumberFormat("it-IT", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
function eur(n) { return n == null ? "–" : nf0.format(Math.round(n)) + " €"; }

function lock(on) { document.body.classList.toggle("lock", on); }
function shrink(file) {

    img.onload = function () {
      var s = Math.min(1, 640 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);

      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.65));
    };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src = url;
  });
}

function setHint(text, t, retry) {

/* ---------- confronto ---------- */
function lines(s) { var a = String(s || "").split("\n").map(function (x) { return x.trim(); }).filter(Boolean); return a.length ? h("ul", null, a.map(function (x) { return h("li", { text: x }); })) : "–"; }
function openCompare() {

  if (items.length < 2) return;
  var aff = S.mode === "affitto";
  var cs = items.map(calc);
  function best(vals, dir) {
    var v = vals.filter(function (x) { return x != null; });
    if (v.length < 2) return null;
    var m = dir < 0 ? Math.min.apply(null, v) : Math.max.apply(null, v);
    return v.every(function (x) { return x === m; }) ? null : m;
  }
  var rows = [
    ["Foto", function (it) {
      var s = it.photo || it.img; if (!s) return "–";

    }],
    ["Stato", function (it) { return statoLabel(it.status); }],
    ["Zona", function (it) { return it.zone || "–"; }],
    ["Stazione", function (it) { return it.station != null ? (it.stationApprox ? "~" : "") + nf0.format(it.station) + " min a piedi" + (it.stationM != null ? " · " + nf0.format(it.stationM) + " m" : "") : "–"; }, function (it) { return it.station; }, -1],
    [aff ? "Canone" : "Prezzo", function (it) { return eur(it.price); }, function (it, i) { return it.price; }, -1],
    ["Spese condominiali", function (it) { return it.condo != null ? eur(it.condo) + "/mese" : "–"; }, function (it) { return it.condo; }, -1],

    ["Al mq", function (it, i) { return ppsmTxt(it.mode, cs[i].ppsm); }, function (it, i) { return cs[i].ppsm; }, -1],
    ["Superficie", function (it) { return it.sqm ? nf0.format(it.sqm) + " mq" : "–"; }, function (it) { return it.sqm; }, 1],
    ["Locali", function (it) { return it.rooms || "–"; }],
    ["Piano", function (it) { return it.floor || "–"; }],
    aff ? ["Arredato", function (it) { return { si: "Sì", parziale: "Parziale", no: "No" }[it.furnished] || "–"; }] : null,

    ["Voto", function (it) { return it.rating ? "★".repeat(it.rating) : "–"; }, function (it) { return it.rating || null; }, 1],

    ["Contro", function (it) { return lines(it.cons); }]

    return h("th", { scope: "col" }, [it.title || "Senza titolo", h("button", { class: "x", type: "button", text: "Togli", onclick: function () { S.selected.delete(it.id); if (S.selected.size < 2) closeCompare(); else openCompare(); renderAll(); } })]);
  })));

$("exportBtn").addEventListener("click", function () {
  var d = new Date(), p = function (n) { return String(n).padStart(2, "0"); };
  var name = "case-backup-" + d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + ".json";
  var blob = new Blob([JSON.stringify({ app: "casa", v: 1, items: S.items, settings: S.settings }, null, 2)], { type: "application/json" });

$("importFile").addEventListener("change", function (e) {
  var file = e.target.files && e.target.files[0]; if (!file) return;
  var r = new FileReader();
  r.onload = function () {
    try {
      var d = JSON.parse(r.result), list = Array.isArray(d) ? d : d.items;
      if (!Array.isArray(list)) throw new Error("formato");
      var have = {}; S.items.forEach(function (x) { have[x.id] = 1; });
      var add = list.filter(function (x) { return x && x.id && x.title && (x.mode === "affitto" || x.mode === "vendita") && !have[x.id]; });
      S.items = S.items.concat(add); save(); renderAll(); say("Ripristinati " + add.length + " annunci.");
    } catch (err) { say("Il file non è un backup valido."); }

  r.readAsText(file);

load(); renderAll();
S.items.filter(function (x) { return x.meta === "loading" && x.url; }).forEach(function (x, i) { setTimeout(function () { enrich(x); }, i * 700); });

})();
