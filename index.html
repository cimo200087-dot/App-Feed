<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Feed">
<meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1217" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Feed Personale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #eceef1;
  --surface: #ffffff;
  --ink: #12161d;
  --muted: #646b78;
  --line: #d9dde3;
  --accent: #e8452c;
  --accent-ink: #ffffff;
  --chip: #e2e5ea;
  --ok: #17754c; --ok-bg: #dcf1e5;
  --warn: #8a5a0b; --warn-bg: #f7e8c8;
  --bad: #b02a1c;
  --font-display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1217; --surface: #181c23; --ink: #eceef2; --muted: #98a0ae;
    --line: #272d37; --accent: #ff6a50; --accent-ink: #1a0905; --chip: #232832;
    --ok: #5fd09b; --ok-bg: #14301f; --warn: #e8bb6a; --warn-bg: #35290f; --bad: #ff8d7e;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
  padding-block: env(safe-area-inset-top, 0px) calc(40px + env(safe-area-inset-bottom, 0px));
}
body.lock { overflow: hidden; }
.wrap { max-width: 1180px; margin-inline: auto; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top {
  position: sticky; top: 0; z-index: 10; background: var(--bg);
  padding-block: 12px 8px; display: flex; flex-direction: column; gap: 8px;
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; margin: 0; }
.brand span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.add { display: flex; gap: 8px; }
.add input {
  flex: 1; min-width: 0; font-size: 16px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
.add input::placeholder { color: var(--muted); }
.add button { border: 0; border-radius: 10px; padding: 0 18px; background: var(--accent); color: var(--accent-ink); font-weight: 500; }

.notice { display: flex; align-items: center; gap: 4px 14px; flex-wrap: wrap; font-size: 13.5px; padding: 8px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); }
.notice[data-t="ok"] { background: var(--ok-bg); color: var(--ok); }
.notice span { flex: 1 1 200px; }
.notice button { border: 0; background: none; text-decoration: underline; color: inherit; padding: 6px 0; font-size: 13.5px; font-weight: 500; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.fchip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.fchip b { font-family: var(--font-mono); font-weight: 500; margin-left: 6px; }
.fchip.plus { border-style: dashed; background: none; }

.banner {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font-size: 13px; color: var(--muted); background: var(--chip);
  border-radius: 10px; padding: 8px 12px; margin-block: 4px 12px;
}
.banner button { background: none; border: 0; text-decoration: underline; white-space: nowrap; padding: 6px 0; font-size: 13px; color: var(--ink); }

.feed { column-count: 2; column-gap: 10px; margin-top: 8px; }
@media (min-width: 720px) { .feed { column-count: 3; column-gap: 14px; } body { padding-inline: 20px; } }
@media (min-width: 1040px) { .feed { column-count: 4; } }

.card {
  position: relative; break-inside: avoid; margin: 0 0 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: block;
}
@media (min-width: 720px) { .card { margin-bottom: 14px; } }
.card.flash { outline: 3px solid var(--accent); outline-offset: -1px; }
.card > a { color: inherit; text-decoration: none; display: block; -webkit-touch-callout: none; }
.media { position: relative; background: linear-gradient(145deg, var(--a), var(--b)); }
.media::after {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(60% 50% at 25% 20%, rgba(255,255,255,.28), transparent 70%),
    radial-gradient(70% 60% at 80% 95%, rgba(0,0,0,.30), transparent 70%);
}
.body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
.src { font-family: var(--font-mono); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.src b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.title { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.15; letter-spacing: -0.01em; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.excerpt { margin: 0; font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; }
.photo .body { padding-block: 8px 10px; }
.photo .title { font-size: 14px; }

.play {
  position: absolute; z-index: 1; left: 50%; top: 50%; translate: -50% -50%;
  width: 46px; height: 46px; border-radius: 50%; background: rgba(0,0,0,.55); display: grid; place-items: center;
}
.play::before { content: ""; border-left: 14px solid #fff; border-block: 8px solid transparent; margin-left: 3px; }
.dur { position: absolute; z-index: 1; right: 8px; bottom: 8px; font-family: var(--font-mono); font-size: 11px; background: rgba(0,0,0,.7); color: #fff; padding: 2px 6px; border-radius: 5px; }
.media.has-img { background: var(--chip); }
.media.has-img::after { display: none; }
.media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

.note { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.note .body { padding: 16px 14px 14px; }
.note .title { font-size: 21px; font-weight: 800; line-height: 1.08; }
.note .src { color: inherit; opacity: .75; }

.tags { display: flex; flex-wrap: wrap; gap: 4px; border: 0; background: none; padding: 0; margin: 0 12px 12px; text-align: left; }
.tag { font-size: 11px; line-height: 1.5; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.tag.add { background: none; border: 1px dashed var(--line); }
.note .tag { background: rgba(255,255,255,.22); color: inherit; }
.note .tag.add { background: none; border-color: currentColor; opacity: .7; }

.rm {
  position: absolute; z-index: 2; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%;
  border: 0; background: rgba(0,0,0,.5); color: #fff; font-size: 17px; line-height: 1; opacity: .85;
}
@media (hover: hover) { .rm { opacity: 0; transition: opacity .15s; } .card:hover .rm, .rm:focus-visible { opacity: 1; } }
.empty { text-align: center; color: var(--muted); padding: 48px 16px; }

.backup { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.backup button, .backup label { font-size: 13px; color: var(--ink); background: var(--chip); border: 0; border-radius: 8px; padding: 9px 12px; cursor: pointer; }
.backup input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
#msg { flex-basis: 100%; min-height: 1.4em; }

.toast {
  position: fixed; z-index: 60; left: 50%; translate: -50% 0; max-width: calc(100% - 24px);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); border-radius: 12px; padding: 8px 8px 8px 14px;
  display: flex; align-items: center; gap: 12px; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.3);
}
.toast button { border: 0; background: rgba(255,255,255,.16); color: inherit; border-radius: 8px; padding: 8px 12px; font-weight: 500; white-space: nowrap; }

.overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; }
.backdrop { position: absolute; inset: 0; background: rgba(8,10,14,.52); }
.sheet {
  position: relative; width: 100%; max-width: 560px; margin-inline: auto; max-height: 90vh; max-height: 90dvh; overflow-y: auto;
  -webkit-overflow-scrolling: touch; background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 0 16px calc(28px + env(safe-area-inset-bottom, 0px));
}
.sheet-head { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 10px; }
.sheet-head h2 { font-family: var(--font-display); font-size: 20px; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
.sheet-head button { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 9px; padding: 8px 16px; font-weight: 500; }
.form { display: flex; flex-direction: column; gap: 12px; }
.sub { margin: 0; color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.row { display: flex; gap: 8px; }
.row input, .srow input[type=text] { flex: 1; min-width: 0; font-size: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
.primary { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 0 16px; font-weight: 500; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.sugg button { border: 1px dashed var(--line); background: none; border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.srow { display: flex; align-items: center; gap: 6px; }
.srow .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); min-width: 22px; text-align: right; }
.ib { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 38px; height: 40px; font-size: 14px; }
.ib:disabled { opacity: .35; }
.danger { border: 1px solid var(--bad); background: none; color: var(--bad); border-radius: 10px; padding: 11px 14px; font-weight: 500; }
.srow .danger { padding: 0 10px; height: 40px; font-size: 13px; white-space: nowrap; }
.check { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); font-size: 16px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.status { font-size: 13px; color: var(--muted); min-height: 1.3em; margin: 0; }

.viewbar{display:flex;flex-direction:column;gap:0}
.back{border:0;background:none;color:var(--accent);font-weight:600;font-size:17px;min-height:44px;padding:0;text-align:left;align-self:flex-start}
.viewbar h2{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0 0 2px}
.lbl{display:flex;align-items:center;justify-content:space-between;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 2px 8px}
.lbl button{border:0;background:none;color:var(--accent);font-size:15px;font-weight:600;letter-spacing:0;text-transform:none;min-height:44px;padding:0 4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:720px){.tiles{grid-template-columns:repeat(4,1fr);gap:14px}}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:28px;line-height:1}
.tile strong{font-family:var(--font-display);font-size:19px;line-height:1.1;font-weight:600;display:block;overflow-wrap:anywhere}
.tile span{font-size:13px;color:var(--muted)}
.tile.wide{grid-column:1/-1;min-height:80px;flex-direction:row;align-items:center;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tile.wide span{color:var(--bg);opacity:.7}
.tile.wide .big{font-family:var(--font-display);font-weight:800;font-size:32px}
.tile.new{grid-column:1/-1;min-height:72px;align-items:center;justify-content:center;border:2px dashed var(--muted);background:none;font-weight:600;font-size:18px;color:var(--ink)}
.fchip{display:none}
.srow{flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.srow input[type=text]{flex:1 1 100%}
.srow .n{flex:1;text-align:left;min-width:0;font-size:13px}
.srow .n::after{content:' link'}
.tags{width:100%;margin:0;padding:0 12px 12px;min-height:44px}
.tag{font-size:13px;padding:7px 12px;font-weight:600}
.tag.add{font-size:14px;padding:10px 16px}
.rm{width:38px;height:38px;font-size:20px}
.sheet-head button{min-height:44px;padding:0 22px}
.opt{display:flex;align-items:center;gap:14px;padding:16px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px;font-weight:600;font-size:17px;min-height:60px;background:var(--surface)}
.opt.on{background:var(--chip);border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.ck{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;color:var(--accent-ink);font-size:18px}
.opt.on .ck{background:var(--accent);border-color:var(--accent)}
.opt.on .ck::after{content:"✓"}
.opt.newopt{border-style:dashed}
.bigbtn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;min-height:56px;font-size:17px;font-weight:700;width:100%;margin-top:6px}
.row input{padding:15px 14px}
.primary{min-height:52px;padding:0 20px;font-size:16px}
.ib{width:46px;height:46px}
.danger{min-height:46px}
.srow .danger{height:46px;padding:0 12px}
.srow input[type=text]{padding:14px 12px}
.sugg button{padding:12px 16px;font-size:15px}
.add button{min-height:50px}
.add input{padding:15px 14px}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Il mio feed</h1><span id="count"></span></div>
    <form class="add" id="addForm">
      <input id="url" type="text" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Incolla un link">
      <button type="submit">Aggiungi</button>
    </form>
    <div class="notice" id="notice" role="status" hidden></div>
    <div class="viewbar" id="viewbar" hidden><button type="button" class="back" id="backBtn">‹ Tutte le sezioni</button><h2 id="viewTitle"></h2></div>
  </header>

  <div class="banner" id="demo" hidden>
    <span>Alcune schede sono esempi. Incolla un link per aggiungere il tuo.</span>
    <button type="button" id="clearDemo">Svuota esempi</button>
  </div>
  <div class="banner" id="dupes" hidden>
    <span id="dupesText"></span>
    <button type="button" id="mergeDupes">Unisci</button>
  </div>

  <section id="home" hidden></section>
  <main class="feed" id="feed"></main>
  <p class="empty" id="empty" hidden></p>

  <footer class="backup">
    <button type="button" id="exportBtn">Scarica backup</button>
    <label for="importFile">Ripristina da file</label>
    <input id="importFile" type="file" accept=".json,application/json">
    <span id="msg" role="status"></span>
  </footer>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<div class="overlay" id="sheetWrap" hidden>
  <div class="backdrop" id="sheetBack"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button type="button" id="sheetClose">Fatto</button></div>
    <div class="form" id="sheetBody"></div>
  </section>
</div>

<script>
(function () {
"use strict";
var KEY = "feed-personale-v1";
var EXAMPLES = [
  { id: "e1", kind: "photo", title: "Cantiere, torre in costruzione", domain: "tua-foto", a: "#1f6f8b", b: "#e8b04a", ratio: "4/5", url: "#" },

  { id: "e4", kind: "note", title: "Chiedere il ribasso offerto sulle ultime tre gare prima di venerdì.", domain: "nota", url: "" },
  { id: "e5", kind: "photo", title: "Facciata a Porta Nuova", domain: "tua-foto", a: "#5c7a54", b: "#e9e3c8", ratio: "1/1", url: "#" },
  { id: "e6", kind: "article", title: "Bando di gara: nuove soglie per i lavori sopra soglia europea", domain: "esempio-gare.it", excerpt: "Cosa cambia per le stazioni appaltanti nelle procedure negoziate.", a: "#7a3b2e", b: "#f0b27a", ratio: "3/2", url: "#" },
  { id: "e7", kind: "video", title: "Timelapse: 14 mesi di cantiere in 90 secondi", domain: "youtube.com", dur: "1:30", a: "#0f3d3e", b: "#7bd3c1", ratio: "16/9", url: "#" },

];
EXAMPLES.forEach(function (x) { x.demo = true; });
var PALETTES = [["#1f6f8b","#e8b04a"],["#5c7a54","#e9e3c8"],["#6b3fa0","#f2a1c4"],["#7a3b2e","#f0b27a"],["#243b53","#829ab1"],["#0f3d3e","#7bd3c1"],["#8a2f4a","#f4c5a6"]];
var RATIOS = ["16/10","4/5","1/1","3/2","16/9"];
var SUGGESTIONS = ["Annunci case vendita", "Annunci case affitto", "Lavoro"];

var items = [], sections = [], view = "home";

function $(id) { return document.getElementById(id); }
function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function h(tag, props, kids) {
  var n = document.createElement(tag), val;
  if (props) Object.keys(props).forEach(function (k) {
    var v = props[k];
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "value") val = v;
    else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  });
  (kids || []).forEach(function (c) { if (c == null || c === false) return; n.appendChild(typeof c === "object" ? c : document.createTextNode(String(c))); });
  if (val !== undefined) n.value = val;
  return n;
}
function say(t) { $("msg").textContent = t || ""; }
function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
function hash(s) { var x = 0; for (var i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) | 0; return Math.abs(x); }

/* ---------- dati ---------- */
function normalize() {
  var ids = {}; sections.forEach(function (s) { ids[s.id] = 1; });
  items.forEach(function (x) {
    if (!Array.isArray(x.sections)) x.sections = [];
    x.sections = x.sections.filter(function (id, i, a) { return ids[id] && a.indexOf(id) === i; });
  });
  if (view !== "home" && view !== "all" && view !== "none" && !ids[view]) view = "home";
}
function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var d = JSON.parse(raw);
      if (d && Array.isArray(d.items)) {
        items = d.items;
        if (Array.isArray(d.sections)) sections = d.sections.filter(function (s) { return s && s.id && typeof s.name === "string"; });
        normalize(); return;
      }

$("clearDemo").addEventListener("click", function () { items = items.filter(function (x) { return !x.demo; }); save(); render(); });
$("mergeDupes").addEventListener("click", function () {
  var n = mergeDupes(); normalize(); save(); render(); say(n ? "Uniti " + n + " doppioni." : "");
  if (n) toast("Uniti " + n + (n === 1 ? " doppione" : " doppioni"));
});
$("sheetClose").addEventListener("click", closeSheet);
$("sheetBack").addEventListener("click", closeSheet);
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("sheetWrap").hidden) closeSheet(); });

/* ---------- backup ---------- */
$("exportBtn").addEventListener("click", function () {
  var d = new Date(), p = function (n) { return String(n).padStart(2, "0"); };
  var name = "feed-backup-" + d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + ".json";
  var blob = new Blob([JSON.stringify({ app: "feed", v: 2, items: items, sections: sections }, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  say("Backup creato: " + items.length + " link e " + sections.length + (sections.length === 1 ? " sezione." : " sezioni."));
});
function importData(d) {
  var list = Array.isArray(d) ? d : d && d.items;
  if (!Array.isArray(list)) throw new Error("formato");
  var map = {};
  (d && Array.isArray(d.sections) ? d.sections : []).forEach(function (s) {
    if (!s || !s.id || typeof s.name !== "string" || !s.name.trim()) return;
    var ex = sections.filter(function (o) { return o.id === s.id; })[0] || sections.filter(function (o) { return o.name.toLowerCase() === s.name.trim().toLowerCase(); })[0];
    if (!ex) { ex = { id: s.id, name: s.name.trim().slice(0, 40) }; sections.push(ex); }
    map[s.id] = ex.id;
  });
  var added = 0, already = 0;
  list.forEach(function (x) {
    if (!x || !x.id || !x.kind || !x.title || x.demo) return;
    var secs = (Array.isArray(x.sections) ? x.sections : []).map(function (id) { return map[id]; }).filter(Boolean);
    var key = normKey(x.url), other = findItem(x.id) || byKey(key);
    if (other) {
      secs.forEach(function (s) { if (other.sections.indexOf(s) < 0) other.sections.push(s); });
      already++; return;
    }
    x.sections = secs.filter(function (s, i, a) { return a.indexOf(s) === i; });
    items.push(x); added++;
  });
  if (added) items = items.filter(function (x) { return !x.demo; });
  normalize(); save(); render();
  return { added: added, already: already };
}
$("importFile").addEventListener("change", function (e) {
  var file = e.target.files && e.target.files[0]; if (!file) return;
  var r = new FileReader();
  r.onload = function () {
    try {
      var res = importData(JSON.parse(r.result));
      say("Ripristinati " + res.added + " link" + (res.already ? ". " + res.already + " erano già presenti e non sono stati duplicati." : "."));
    } catch (err) { say("Il file non è un backup valido."); }
    e.target.value = "";
  };
  r.readAsText(file);
});

load(); render();
items.filter(function (x) { return !x.demo && (x.kind === "article" || x.kind === "video") && x.status !== "ok"; })
  .forEach(function (x, i) { setTimeout(function () { enrich(x); }, i * 700); });
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
})();
